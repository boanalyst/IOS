workflows:

  # ─────────────────────────────────────────────────────────────────────────
  # BoAnalyst iOS — App Store & TestFlight Workflow (Master)
  # ─────────────────────────────────────────────────────────────────────────

  ios-release:
    name: BoAnalyst — TestFlight & App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Secrets should be set in the Codemagic UI (mark as secret):
      #   APP_STORE_CONNECT_ISSUER_ID
      #   APP_STORE_CONNECT_KEY_IDENTIFIER
      #   APP_STORE_CONNECT_PRIVATE_KEY
      #   APPLE_TEAM_ID
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.boanalyst.app
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.boanalyst.app"
        XCODE_SCHEME: "BoAnalyst"
        # Workspace is generated by CocoaPods inside the BoAnalystXcode folder
        XCODE_WORKSPACE: "IOSDeployment/BoAnalystXcode/BoAnalyst.xcworkspace"
        BUILD_DIR: "IOSDeployment/BoAnalystXcode/build"
        EXPORT_PLIST: "IOSDeployment/BoAnalystXcode/ExportOptions-AppStore.plist"

    scripts:

      # ── Step 1: Install build tools ────────────────────────────────────
      - name: Install Tools
        script: |
          brew install xcodegen
          gem install xcpretty --no-document

      # ── Step 2: Scaffold Xcode Project ──────────────────────────────────
      - name: Scaffold Xcode Project
        script: |
          set -euo pipefail
          BASE="$CM_BUILD_DIR/IOSDeployment"
          PROJ="$BASE/BoAnalystXcode"
          
          mkdir -p "$PROJ/BoAnalyst"

          echo "▶ Copying source files..."
          find "$BASE/swift" -name "*.swift" -exec cp {} "$PROJ/BoAnalyst/" \;
          cp "$BASE/Info.plist" "$PROJ/BoAnalyst/Info.plist"
          cp "$BASE/Podfile" "$PROJ/Podfile"

          echo "▶ Generating Assets.xcassets..."
          ASSETS="$PROJ/BoAnalyst/Assets.xcassets"
          mkdir -p "$ASSETS/AppIcon.appiconset"
          mkdir -p "$ASSETS/AccentColor.colorset"

          cat > "$ASSETS/Contents.json" <<'EOF'
{ "info" : { "author" : "xcode", "version" : 1 } }
EOF

          cat > "$ASSETS/AccentColor.colorset/Contents.json" <<'EOF'
{
  "colors" : [
    {
      "color" : {
        "color-space" : "srgb",
        "components" : { "alpha" : "1.000", "blue" : "0.000", "green" : "0.843", "red" : "1.000" }
      },
      "idiom" : "universal"
    }
  ],
  "info" : { "author" : "xcode", "version" : 1 }
}
EOF

          if [ -f "$BASE/assets/AppIcon-1024.png" ]; then
            ICON_SRC="$BASE/assets/AppIcon-1024.png"
            ICONSET="$ASSETS/AppIcon.appiconset"
            sips -z 20   20   "$ICON_SRC" --out "$ICONSET/AppIcon-20.png"   > /dev/null
            sips -z 29   29   "$ICON_SRC" --out "$ICONSET/AppIcon-29.png"   > /dev/null
            sips -z 40   40   "$ICON_SRC" --out "$ICONSET/AppIcon-40.png"   > /dev/null
            sips -z 58   58   "$ICON_SRC" --out "$ICONSET/AppIcon-58.png"   > /dev/null
            sips -z 60   60   "$ICON_SRC" --out "$ICONSET/AppIcon-60.png"   > /dev/null
            sips -z 76   76   "$ICON_SRC" --out "$ICONSET/AppIcon-76.png"   > /dev/null
            sips -z 80   80   "$ICON_SRC" --out "$ICONSET/AppIcon-80.png"   > /dev/null
            sips -z 87   87   "$ICON_SRC" --out "$ICONSET/AppIcon-87.png"   > /dev/null
            sips -z 120  120  "$ICON_SRC" --out "$ICONSET/AppIcon-120.png"  > /dev/null
            sips -z 152  152  "$ICON_SRC" --out "$ICONSET/AppIcon-152.png"  > /dev/null
            sips -z 167  167  "$ICON_SRC" --out "$ICONSET/AppIcon-167.png"  > /dev/null
            sips -z 180  180  "$ICON_SRC" --out "$ICONSET/AppIcon-180.png"  > /dev/null
            sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET/AppIcon-1024.png" > /dev/null

            cat > "$ICONSET/Contents.json" <<'EOF'
{
  "images" : [
    {"filename":"AppIcon-20.png",   "idiom":"iphone","scale":"1x","size":"20x20"},
    {"filename":"AppIcon-40.png",   "idiom":"iphone","scale":"2x","size":"20x20"},
    {"filename":"AppIcon-60.png",   "idiom":"iphone","scale":"3x","size":"20x20"},
    {"filename":"AppIcon-29.png",   "idiom":"iphone","scale":"1x","size":"29x29"},
    {"filename":"AppIcon-58.png",   "idiom":"iphone","scale":"2x","size":"29x29"},
    {"filename":"AppIcon-87.png",   "idiom":"iphone","scale":"3x","size":"29x29"},
    {"filename":"AppIcon-80.png",   "idiom":"iphone","scale":"2x","size":"40x40"},
    {"filename":"AppIcon-120.png",  "idiom":"iphone","scale":"3x","size":"40x40"},
    {"filename":"AppIcon-120.png",  "idiom":"iphone","scale":"2x","size":"60x60"},
    {"filename":"AppIcon-180.png",  "idiom":"iphone","scale":"3x","size":"60x60"},
    {"filename":"AppIcon-20.png",   "idiom":"ipad",  "scale":"1x","size":"20x20"},
    {"filename":"AppIcon-40.png",   "idiom":"ipad",  "scale":"2x","size":"20x20"},
    {"filename":"AppIcon-29.png",   "idiom":"ipad",  "scale":"1x","size":"29x29"},
    {"filename":"AppIcon-58.png",   "idiom":"ipad",  "scale":"2x","size":"29x29"},
    {"filename":"AppIcon-40.png",   "idiom":"ipad",  "scale":"1x","size":"40x40"},
    {"filename":"AppIcon-80.png",   "idiom":"ipad",  "scale":"2x","size":"40x40"},
    {"filename":"AppIcon-76.png",   "idiom":"ipad",  "scale":"1x","size":"76x76"},
    {"filename":"AppIcon-152.png",  "idiom":"ipad",  "scale":"2x","size":"76x76"},
    {"filename":"AppIcon-167.png",  "idiom":"ipad",  "scale":"2x","size":"83.5x83.5"},
    {"filename":"AppIcon-1024.png", "idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
  ],
  "info" : { "author" : "xcode", "version" : 1 }
}
EOF
            echo "✅ Icons generated."
          fi

          echo "▶ Generating ExportOptions..."
          cat > "$PROJ/ExportOptions-AppStore.plist" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key><string>app-store</string>
  <key>teamID</key><string>${APPLE_TEAM_ID}</string>
  <key>uploadBitcode</key><false/>
  <key>uploadSymbols</key><true/>
  <key>signingStyle</key><string>manual</string>
</dict>
</plist>
EOF

          echo "▶ Generating Entitlements..."
          cat > "$PROJ/BoAnalyst/BoAnalyst.entitlements" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>com.apple.developer.associated-domains</key>
  <array><string>applinks:boanalyst.com</string></array>
  <key>com.apple.developer.applesignin</key>
  <array><string>Default</string></array>
  <key>aps-environment</key>
  <string>production</string>
</dict>
</plist>
EOF

          echo "▶ Copying fonts..."
          for font in "Cinzel-Regular.ttf" "Cinzel-Bold.ttf" "Cinzel-Black.ttf"; do
            [ -f "$BASE/assets/$font" ] && cp "$BASE/assets/$font" "$PROJ/" && echo "✅ $font copied."
          done

          echo "▶ Generating project.yml..."
          cat > "$PROJ/project.yml" <<EOF
name: BoAnalyst
options:
  bundleIdPrefix: com.boanalyst
  deploymentTarget: { iOS: "16.0" }
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER:-1}"
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    GENERATE_INFOPLIST: NO
targets:
  BoAnalyst:
    type: application
    platform: iOS
    sources:
      - path: BoAnalyst
        excludes: ["**/*.md", "**/*.plist", "**/*.xcassets"]
    resources:
      - path: BoAnalyst/Assets.xcassets
      - path: BoAnalyst/Info.plist
      - "*.ttf"
    settings:
      base:
        INFOPLIST_FILE: BoAnalyst/Info.plist
        PRODUCT_NAME: BoAnalyst
    entitlements:
      path: BoAnalyst/BoAnalyst.entitlements
EOF

          echo "▶ Running XcodeGen..."
          cd "$PROJ" && xcodegen generate
          echo "✅ BoAnalyst.xcodeproj generated."

      # ── Step 3: Install CocoaPods ───────────────────────────────────────
      - name: Install Pods
        script: |
          cd "IOSDeployment/BoAnalystXcode"
          pod install --repo-update
          echo "✅ Pods installed."

      # ── Step 4: Code Signing ────────────────────────────────────────────
      - name: Set Up Code Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          echo "✅ Code signing configured."

      # ── Step 5: Build & Archive ─────────────────────────────────────────
      - name: Build & Archive
        script: |
          mkdir -p "$BUILD_DIR"
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$BUILD_DIR/BoAnalyst.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            2>&1 | xcpretty

          xcodebuild -exportArchive \
            -archivePath "$BUILD_DIR/BoAnalyst.xcarchive" \
            -exportPath "$BUILD_DIR/Export" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            2>&1 | xcpretty
          echo "✅ IPA exported."

    artifacts:
      - IOSDeployment/BoAnalystXcode/build/Export/*.ipa
      - IOSDeployment/BoAnalystXcode/build/BoAnalyst.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_review: false
