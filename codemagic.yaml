workflows:

  # ─────────────────────────────────────────────────────────────────────────
  # BoAnalyst iOS — App Store & TestFlight
  # This file must be at the ROOT of your github.com/boanalyst/IOS repository.
  #
  # REQUIRED secrets — add in Codemagic UI → Environment Variables (mark encrypted):
  #   APP_STORE_CONNECT_ISSUER_ID       ← App Store Connect > Users > Integrations > Keys
  #   APP_STORE_CONNECT_KEY_IDENTIFIER  ← Key ID (10 chars)
  #   APP_STORE_CONNECT_PRIVATE_KEY     ← Full text of your .p8 file (paste as-is)
  #   APPLE_TEAM_ID                     ← Your 10-char Team ID (e.g. AB12CD34EF)
  # ─────────────────────────────────────────────────────────────────────────

  ios-release:
    name: BoAnalyst — TestFlight & App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - env_codemagic
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.boanalyst.app
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.boanalyst.app"
        XCODE_SCHEME: "BoAnalyst"
        XCODE_WORKSPACE: "BoAnalystXcode/BoAnalyst.xcworkspace"
        BUILD_DIR: "BoAnalystXcode/build"

    scripts:

      # ── Step 1: Install build tools ────────────────────────────────────
      - name: Install XcodeGen & xcpretty
        script: |
          brew install xcodegen
          gem install xcpretty --no-document

      # ── Step 2: Scaffold Xcode project from Swift source files ─────────
      - name: Scaffold Xcode Project
        script: |
          set -euo pipefail

          cd IOSDeployment

          # Structure expected:
          #   swift/       — all .swift source subdirs
          #   Info.plist
          #   Podfile
          #   assets/      — AppIcon-1024.png, fonts

          mkdir -p BoAnalystXcode/BoAnalyst

          echo "▶ Copying Swift source files..."
          find swift -name "*.swift" -exec cp {} BoAnalystXcode/BoAnalyst/ \;

          echo "▶ Copying Info.plist..."
          cp Info.plist BoAnalystXcode/BoAnalyst/Info.plist

          echo "▶ Copying Podfile..."
          cp Podfile BoAnalystXcode/Podfile

          echo "▶ Building Assets.xcassets..."
          ASSETS="BoAnalystXcode/BoAnalyst/Assets.xcassets"
          mkdir -p "$ASSETS/AppIcon.appiconset"
          mkdir -p "$ASSETS/AccentColor.colorset"

          cat > "$ASSETS/Contents.json" << 'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF

          cat > "$ASSETS/AppIcon.appiconset/Contents.json" << 'EOF'
          {
            "images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],
            "info":{"author":"xcode","version":1}
          }
          EOF

          cat > "$ASSETS/AccentColor.colorset/Contents.json" << 'EOF'
          {
            "colors":[{"color":{"color-space":"srgb","components":{"alpha":"1.000","blue":"0.000","green":"0.843","red":"1.000"}},"idiom":"universal"}],
            "info":{"author":"xcode","version":1}
          }
          EOF

          if [ -f "assets/AppIcon-1024.png" ]; then
            cp assets/AppIcon-1024.png "$ASSETS/AppIcon.appiconset/AppIcon-1024.png"
            echo "✅ AppIcon copied."
          else
            echo "⚠️  WARNING: assets/AppIcon-1024.png missing — App Store will reject without it."
          fi

          for font in "Cinzel-Regular.ttf" "Cinzel-Bold.ttf" "Cinzel-Black.ttf"; do
            [ -f "assets/$font" ] && cp "assets/$font" BoAnalystXcode/BoAnalyst/ && echo "✅ $font copied."
          done

          echo "▶ Writing ExportOptions-AppStore.plist..."
          cat > BoAnalystXcode/ExportOptions-AppStore.plist << EXPORT_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EXPORT_EOF

          echo "▶ Generating project.yml for XcodeGen..."
          cat > BoAnalystXcode/project.yml << PROJECT_EOF
          name: BoAnalyst
          options:
            bundleIdPrefix: com.boanalyst
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true
          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
              MARKETING_VERSION: "1.0.0"
              CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
              SWIFT_VERSION: "5.10"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              CODE_SIGN_STYLE: Manual
              DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
              ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
              DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          targets:
            BoAnalyst:
              type: application
              platform: iOS
              sources:
                - path: BoAnalyst
                  excludes:
                    - "**/*.md"
                    - "**/*.plist"
              resources:
                - path: BoAnalyst/Assets.xcassets
                - path: BoAnalyst/Info.plist
              settings:
                base:
                  INFOPLIST_FILE: BoAnalyst/Info.plist
                  PRODUCT_NAME: BoAnalyst
          PROJECT_EOF

          echo "▶ Running XcodeGen..."
          cd BoAnalystXcode
          xcodegen generate
          echo "✅ BoAnalyst.xcodeproj generated."

      # ── Step 3: Install CocoaPods ───────────────────────────────────────
      - name: Install Pods
        script: |
          cd IOSDeployment
          cd BoAnalystXcode
          pod install --repo-update
          echo "✅ Pods installed."

      # ── Step 4: Code Signing (using manually uploaded keys) ─────────────
      - name: Set Up Code Signing
        script: |
          cd IOSDeployment
          xcode-project use-profiles
          echo "✅ Code signing configured from uploaded identities."

      # ── Step 5: Build & Archive ─────────────────────────────────────────
      - name: Build & Archive
        script: |
          cd IOSDeployment
          mkdir -p "$BUILD_DIR/Export"

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$BUILD_DIR/Export"

          echo "✅ Build complete."

    artifacts:
      - IOSDeployment/**/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
