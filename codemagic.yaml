workflows:

  # ─────────────────────────────────────────────────────────────────────────
  # BoAnalyst iOS — App Store & TestFlight
  # This file must be at the ROOT of your github.com/boanalyst/IOS repository.
  #
  # REQUIRED secrets — add in Codemagic UI → Environment Variables (mark encrypted):
  #   APP_STORE_CONNECT_ISSUER_ID       ← App Store Connect > Users > Integrations > Keys
  #   APP_STORE_CONNECT_KEY_IDENTIFIER  ← Key ID (10 chars)
  #   APP_STORE_CONNECT_PRIVATE_KEY     ← Full text of your .p8 file (paste as-is)
  #   APPLE_TEAM_ID                     ← Your 10-char Team ID (e.g. AB12CD34EF)
  # ─────────────────────────────────────────────────────────────────────────

  ios-release:
    name: BoAnalyst — TestFlight & App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - env_codemagic
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.boanalyst.app
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.boanalyst.app"
        XCODE_SCHEME: "BoAnalyst"
        XCODE_WORKSPACE: "BoAnalystXcode/BoAnalyst.xcworkspace"
        BUILD_DIR: "BoAnalystXcode/build"

    scripts:

      # ── Step 1: Install build tools ────────────────────────────────────
      - name: Install XcodeGen & xcpretty
        script: |
          brew install xcodegen
          gem install xcpretty --no-document

      # ── Step 2: Scaffold Xcode project from Swift source files ─────────
      - name: Scaffold Xcode Project
        script: |
          set -euo pipefail
          cd IOSDeployment

          mkdir -p BoAnalystXcode/BoAnalyst

          echo "▶ Copying Swift source files..."
          find swift -name "*.swift" -exec cp {} BoAnalystXcode/BoAnalyst/ \;

          echo "▶ Copying Info.plist..."
          cp Info.plist BoAnalystXcode/BoAnalyst/Info.plist

          echo "▶ Copying Podfile..."
          cp Podfile BoAnalystXcode/Podfile

          echo "▶ Building Assets.xcassets..."
          ASSETS="BoAnalystXcode/BoAnalyst/Assets.xcassets"
          mkdir -p "$ASSETS/AppIcon.appiconset"
          mkdir -p "$ASSETS/AccentColor.colorset"

          cat > "$ASSETS/Contents.json" <<'EOF'
{ "info" : { "author" : "xcode", "version" : 1 } }
EOF

          cat > "$ASSETS/AccentColor.colorset/Contents.json" <<'EOF'
{
  "colors" : [
    {
      "color" : {
        "color-space" : "srgb",
        "components" : { "alpha" : "1.000", "blue" : "0.000", "green" : "0.843", "red" : "1.000" }
      },
      "idiom" : "universal"
    }
  ],
  "info" : { "author" : "xcode", "version" : 1 }
}
EOF

          if [ -f "assets/AppIcon-1024.png" ]; then
            SRC="assets/AppIcon-1024.png"
            ICONSET="$ASSETS/AppIcon.appiconset"

            echo "▶ Generating all required icon sizes via sips..."
            sips -z 20   20   "$SRC" --out "$ICONSET/AppIcon-20.png"   > /dev/null
            sips -z 29   29   "$SRC" --out "$ICONSET/AppIcon-29.png"   > /dev/null
            sips -z 40   40   "$SRC" --out "$ICONSET/AppIcon-40.png"   > /dev/null
            sips -z 58   58   "$SRC" --out "$ICONSET/AppIcon-58.png"   > /dev/null
            sips -z 60   60   "$SRC" --out "$ICONSET/AppIcon-60.png"   > /dev/null
            sips -z 76   76   "$SRC" --out "$ICONSET/AppIcon-76.png"   > /dev/null
            sips -z 80   80   "$SRC" --out "$ICONSET/AppIcon-80.png"   > /dev/null
            sips -z 87   87   "$SRC" --out "$ICONSET/AppIcon-87.png"   > /dev/null
            sips -z 120  120  "$SRC" --out "$ICONSET/AppIcon-120.png"  > /dev/null
            sips -z 152  152  "$SRC" --out "$ICONSET/AppIcon-152.png"  > /dev/null
            sips -z 167  167  "$SRC" --out "$ICONSET/AppIcon-167.png"  > /dev/null
            sips -z 180  180  "$SRC" --out "$ICONSET/AppIcon-180.png"  > /dev/null
            sips -z 1024 1024 "$SRC" --out "$ICONSET/AppIcon-1024.png" > /dev/null

            cat > "$ICONSET/Contents.json" <<'EOF'
{
  "images" : [
    {"filename":"AppIcon-20.png",   "idiom":"iphone","scale":"1x","size":"20x20"},
    {"filename":"AppIcon-40.png",   "idiom":"iphone","scale":"2x","size":"20x20"},
    {"filename":"AppIcon-60.png",   "idiom":"iphone","scale":"3x","size":"20x20"},
    {"filename":"AppIcon-29.png",   "idiom":"iphone","scale":"1x","size":"29x29"},
    {"filename":"AppIcon-58.png",   "idiom":"iphone","scale":"2x","size":"29x29"},
    {"filename":"AppIcon-87.png",   "idiom":"iphone","scale":"3x","size":"29x29"},
    {"filename":"AppIcon-80.png",   "idiom":"iphone","scale":"2x","size":"40x40"},
    {"filename":"AppIcon-120.png",  "idiom":"iphone","scale":"3x","size":"40x40"},
    {"filename":"AppIcon-120.png",  "idiom":"iphone","scale":"2x","size":"60x60"},
    {"filename":"AppIcon-180.png",  "idiom":"iphone","scale":"3x","size":"60x60"},
    {"filename":"AppIcon-20.png",   "idiom":"ipad",  "scale":"1x","size":"20x20"},
    {"filename":"AppIcon-40.png",   "idiom":"ipad",  "scale":"2x","size":"20x20"},
    {"filename":"AppIcon-29.png",   "idiom":"ipad",  "scale":"1x","size":"29x29"},
    {"filename":"AppIcon-58.png",   "idiom":"ipad",  "scale":"2x","size":"29x29"},
    {"filename":"AppIcon-40.png",   "idiom":"ipad",  "scale":"1x","size":"40x40"},
    {"filename":"AppIcon-80.png",   "idiom":"ipad",  "scale":"2x","size":"40x40"},
    {"filename":"AppIcon-76.png",   "idiom":"ipad",  "scale":"1x","size":"76x76"},
    {"filename":"AppIcon-152.png",  "idiom":"ipad",  "scale":"2x","size":"76x76"},
    {"filename":"AppIcon-167.png",  "idiom":"ipad",  "scale":"2x","size":"83.5x83.5"},
    {"filename":"AppIcon-1024.png", "idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
  ],
  "info" : { "author" : "xcode", "version" : 1 }
}
EOF
            echo "✅ All icons generated."
          else
            echo "⚠️  WARNING: assets/AppIcon-1024.png missing."
          fi

          echo "▶ Copying fonts..."
          for font in "Cinzel-Regular.ttf" "Cinzel-Bold.ttf" "Cinzel-Black.ttf"; do
            [ -f "assets/$font" ] && cp "assets/$font" BoAnalystXcode/BoAnalyst/ && echo "✅ $font copied."
          done

          echo "▶ Generating ExportOptions..."
          cat > BoAnalystXcode/ExportOptions-AppStore.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key><string>app-store</string>
  <key>teamID</key><string>$APPLE_TEAM_ID</string>
  <key>uploadBitcode</key><false/>
  <key>uploadSymbols</key><true/>
  <key>signingStyle</key><string>manual</string>
</dict>
</plist>
EOF

          echo "▶ Generating Entitlements..."
          cat > BoAnalystXcode/BoAnalyst/BoAnalyst.entitlements <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>com.apple.developer.associated-domains</key>
  <array><string>applinks:boanalyst.com</string></array>
  <key>com.apple.developer.applesignin</key>
  <array><string>Default</string></array>
  <key>aps-environment</key>
  <string>production</string>
</dict>
</plist>
EOF

          echo "▶ Generating project.yml..."
          cat > BoAnalystXcode/project.yml <<EOF
name: BoAnalyst
options:
  bundleIdPrefix: com.boanalyst
  deploymentTarget: { iOS: "16.0" }
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID:-com.boanalyst.app}
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER:-1}"
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    GENERATE_INFOPLIST: NO
targets:
  BoAnalyst:
    type: application
    platform: iOS
    sources:
      - path: BoAnalyst
        excludes: ["**/*.md", "**/*.plist", "**/*.xcassets"]
    resources:
      - path: BoAnalyst/Assets.xcassets
      - path: BoAnalyst/Info.plist
      - "BoAnalyst/*.ttf"
    settings:
      base:
        INFOPLIST_FILE: BoAnalyst/Info.plist
        PRODUCT_NAME: BoAnalyst
    entitlements:
      path: BoAnalyst/BoAnalyst.entitlements
EOF

          echo "▶ all scaffold files written successfully."
          echo "▶ Running XcodeGen..."
          cd BoAnalystXcode && xcodegen generate



          echo "✅ BoAnalyst.xcodeproj generated."

      # ── Step 3: Install CocoaPods ───────────────────────────────────────
      - name: Install Pods
        script: |
          set -euo pipefail
          cd IOSDeployment/BoAnalystXcode
          pod install --repo-update
          echo "✅ Pods installed."

      # ── Step 4: Code Signing (using manually uploaded keys) ─────────────
      - name: Set Up Code Signing
        script: |
          xcode-project use-profiles
          echo "✅ Code signing configured from uploaded identities."

      # ── Step 5: Build & Archive ─────────────────────────────────────────
      - name: Build & Archive
        script: |
          set -euo pipefail
          cd IOSDeployment
          mkdir -p "$BUILD_DIR/Export"

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$BUILD_DIR/Export"

          echo "✅ Archive & IPA export complete."

    artifacts:
      - IOSDeployment/BoAnalystXcode/build/Export/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
