workflows:

  # ─────────────────────────────────────────────────────────────────────────
  # BoAnalyst iOS — App Store & TestFlight
  # ─────────────────────────────────────────────────────────────────────────

  ios-release:
    name: BoAnalyst — TestFlight & App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - env_codemagic
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.boanalyst.app
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.boanalyst.app"
        XCODE_SCHEME: "BoAnalyst"
        XCODE_WORKSPACE: "BoAnalystXcode/BoAnalyst.xcworkspace"
        BUILD_DIR: "BoAnalystXcode/build"

    scripts:

      # ── Step 1: Install build tools ────────────────────────────────────
      - name: Install XcodeGen & xcpretty
        script: |
          brew install xcodegen
          gem install xcpretty --no-document

      # ── Step 2a: Generate all scaffold files (Python — no heredoc issues)
      - name: Generate Scaffold Files
        script: |
          #!/usr/bin/env python3
          import json, os, subprocess

          base     = "IOSDeployment/BoAnalystXcode/BoAnalyst"
          assets   = base + "/Assets.xcassets"
          iconset  = assets + "/AppIcon.appiconset"
          accent   = assets + "/AccentColor.colorset"
          team_id  = os.environ.get("APPLE_TEAM_ID", "")
          bundle   = os.environ.get("BUNDLE_ID", "com.boanalyst.app")
          build_no = os.environ.get("BUILD_NUMBER", "1")

          for d in [base, assets, iconset, accent,
                    "IOSDeployment/BoAnalystXcode"]:
              os.makedirs(d, exist_ok=True)

          # Assets root Contents.json
          with open(assets + "/Contents.json", "w") as f:
              json.dump({"info": {"author": "xcode", "version": 1}}, f)

          # AccentColor
          with open(accent + "/Contents.json", "w") as f:
              json.dump({
                  "colors": [{"color": {"color-space": "srgb", "components": {
                      "alpha": "1.000", "blue": "0.000",
                      "green": "0.843", "red": "1.000"}},
                      "idiom": "universal"}],
                  "info": {"author": "xcode", "version": 1}
              }, f, indent=2)

          # AppIcon Contents.json — all required sizes
          with open(iconset + "/Contents.json", "w") as f:
              json.dump({
                  "images": [
                      {"filename": "AppIcon-20.png",   "idiom": "iphone", "scale": "1x", "size": "20x20"},
                      {"filename": "AppIcon-40.png",   "idiom": "iphone", "scale": "2x", "size": "20x20"},
                      {"filename": "AppIcon-60.png",   "idiom": "iphone", "scale": "3x", "size": "20x20"},
                      {"filename": "AppIcon-29.png",   "idiom": "iphone", "scale": "1x", "size": "29x29"},
                      {"filename": "AppIcon-58.png",   "idiom": "iphone", "scale": "2x", "size": "29x29"},
                      {"filename": "AppIcon-87.png",   "idiom": "iphone", "scale": "3x", "size": "29x29"},
                      {"filename": "AppIcon-80.png",   "idiom": "iphone", "scale": "2x", "size": "40x40"},
                      {"filename": "AppIcon-120.png",  "idiom": "iphone", "scale": "3x", "size": "40x40"},
                      {"filename": "AppIcon-120.png",  "idiom": "iphone", "scale": "2x", "size": "60x60"},
                      {"filename": "AppIcon-180.png",  "idiom": "iphone", "scale": "3x", "size": "60x60"},
                      {"filename": "AppIcon-20.png",   "idiom": "ipad",   "scale": "1x", "size": "20x20"},
                      {"filename": "AppIcon-40.png",   "idiom": "ipad",   "scale": "2x", "size": "20x20"},
                      {"filename": "AppIcon-29.png",   "idiom": "ipad",   "scale": "1x", "size": "29x29"},
                      {"filename": "AppIcon-58.png",   "idiom": "ipad",   "scale": "2x", "size": "29x29"},
                      {"filename": "AppIcon-40.png",   "idiom": "ipad",   "scale": "1x", "size": "40x40"},
                      {"filename": "AppIcon-80.png",   "idiom": "ipad",   "scale": "2x", "size": "40x40"},
                      {"filename": "AppIcon-76.png",   "idiom": "ipad",   "scale": "1x", "size": "76x76"},
                      {"filename": "AppIcon-152.png",  "idiom": "ipad",   "scale": "2x", "size": "76x76"},
                      {"filename": "AppIcon-167.png",  "idiom": "ipad",   "scale": "2x", "size": "83.5x83.5"},
                      {"filename": "AppIcon-1024.png", "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024"},
                  ],
                  "info": {"author": "xcode", "version": 1}
              }, f, indent=2)

          # Entitlements — Sign in with Apple
          with open(base + "/BoAnalyst.entitlements", "w") as f:
              f.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'
                  ' "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
                  '<plist version="1.0">\n<dict>\n'
                  '  <key>com.apple.developer.applesignin</key>\n'
                  '  <array><string>Default</string></array>\n'
                  '</dict>\n</plist>\n'
              )

          # ExportOptions
          with open("IOSDeployment/BoAnalystXcode/ExportOptions-AppStore.plist", "w") as f:
              f.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'
                  ' "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
                  '<plist version="1.0"><dict>\n'
                  '  <key>method</key><string>app-store</string>\n'
                  f'  <key>teamID</key><string>{team_id}</string>\n'
                  '  <key>uploadBitcode</key><false/>\n'
                  '  <key>uploadSymbols</key><true/>\n'
                  '  <key>signingStyle</key><string>manual</string>\n'
                  '</dict></plist>\n'
              )

          # project.yml
          with open("IOSDeployment/BoAnalystXcode/project.yml", "w") as f:
              f.write(f"""name: BoAnalyst
options:
  bundleIdPrefix: com.boanalyst
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: {bundle}
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "{build_no}"
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: {team_id}
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    SUPPORTS_MACCATALYST: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BoAnalyst:
    type: application
    platform: iOS
    sources:
      - path: BoAnalyst
        excludes:
          - "**/*.md"
          - "**/*.plist"
          - "**/*.xcassets"
    resources:
      - path: BoAnalyst/Assets.xcassets
      - "BoAnalyst/*.ttf"
    settings:
      base:
        INFOPLIST_FILE: BoAnalyst/Info.plist
        PRODUCT_NAME: BoAnalyst
        CODE_SIGN_ENTITLEMENTS: BoAnalyst/BoAnalyst.entitlements
""")

          print("All scaffold files written successfully.")

      # ── Step 2b: Copy sources & generate icons (bash — no file writing)
      - name: Scaffold Xcode Project
        script: |
          set -euo pipefail
          cd IOSDeployment

          echo "Copying Swift source files..."
          find swift -name "*.swift" -exec cp {} BoAnalystXcode/BoAnalyst/ \;

          echo "Copying Info.plist..."
          cp Info.plist BoAnalystXcode/BoAnalyst/Info.plist

          echo "Copying Podfile..."
          cp Podfile BoAnalystXcode/Podfile

          echo "Copying fonts..."
          for font in "Cinzel-Regular.ttf" "Cinzel-Bold.ttf" "Cinzel-Black.ttf"; do
            if [ -f "assets/$font" ]; then
              cp "assets/$font" BoAnalystXcode/BoAnalyst/
              echo "Copied $font"
            fi
          done

          if [ -f "assets/AppIcon-1024.png" ]; then
            SRC="assets/AppIcon-1024.png"
            ICONSET="BoAnalystXcode/BoAnalyst/Assets.xcassets/AppIcon.appiconset"
            echo "Generating icon sizes..."
            sips -z 20   20   "$SRC" --out "$ICONSET/AppIcon-20.png"   > /dev/null
            sips -z 29   29   "$SRC" --out "$ICONSET/AppIcon-29.png"   > /dev/null
            sips -z 40   40   "$SRC" --out "$ICONSET/AppIcon-40.png"   > /dev/null
            sips -z 58   58   "$SRC" --out "$ICONSET/AppIcon-58.png"   > /dev/null
            sips -z 60   60   "$SRC" --out "$ICONSET/AppIcon-60.png"   > /dev/null
            sips -z 76   76   "$SRC" --out "$ICONSET/AppIcon-76.png"   > /dev/null
            sips -z 80   80   "$SRC" --out "$ICONSET/AppIcon-80.png"   > /dev/null
            sips -z 87   87   "$SRC" --out "$ICONSET/AppIcon-87.png"   > /dev/null
            sips -z 120  120  "$SRC" --out "$ICONSET/AppIcon-120.png"  > /dev/null
            sips -z 152  152  "$SRC" --out "$ICONSET/AppIcon-152.png"  > /dev/null
            sips -z 167  167  "$SRC" --out "$ICONSET/AppIcon-167.png"  > /dev/null
            sips -z 180  180  "$SRC" --out "$ICONSET/AppIcon-180.png"  > /dev/null
            sips -z 1024 1024 "$SRC" --out "$ICONSET/AppIcon-1024.png" > /dev/null
            echo "All icon sizes generated."
          else
            echo "WARNING: assets/AppIcon-1024.png missing."
            exit 1
          fi

          echo "Running XcodeGen..."
          cd BoAnalystXcode
          xcodegen generate
          echo "XcodeGen done."

      # ── Step 3: Install CocoaPods ───────────────────────────────────────
      - name: Install Pods
        script: |
          set -euo pipefail
          cd IOSDeployment/BoAnalystXcode
          pod install --repo-update
          echo "Pods installed."

      # ── Step 4: Code Signing ────────────────────────────────────────────
      - name: Set Up Code Signing
        script: |
          xcode-project use-profiles
          echo "Code signing configured."

      # ── Step 5: Build & Archive ─────────────────────────────────────────
      - name: Build & Archive
        script: |
          set -euo pipefail
          cd IOSDeployment
          mkdir -p "$BUILD_DIR/Export"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --ipa-directory "$BUILD_DIR/Export"
          echo "Build complete."

    artifacts:
      - IOSDeployment/BoAnalystXcode/build/Export/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
